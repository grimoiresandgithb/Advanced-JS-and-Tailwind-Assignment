<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Unit Converter</title>
        <link href="./output.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>

    <body class="min-h-screen bg-slate-100">
        <main class="mx-auto max-w-4xl p-6">
            <!-- Page heading -->
             <header class="mb-8 text-center">
                <h1 class="text-4xl font-bold text-slate-800">
                    Unit Converter 
                </h1>
                <p class="mt-3 text-slate-600">
                    Quick and easy metric and imperial conversions
                </p>
             </header>

             <!-- Converter card -->
             <section class="rounded-2xl bg-white p-6 shadow-lg">
                <!-- Navigation Tabs -->
                 <nav class="mb-6 flex flex-wrap gap-2" aria-label="Conversion categories">
                    <button id="weight-tab" class="rounded-lg bg-indigo-600 px-5 py-3 font-medium text-white">
                        Weight 
                    </button>

                    <button id="distance-tab" class="rounded-lg bg-slate-100 px-5 py-3 font-medium text-slate-700">
                        Distance 
                    </button>

                    <button id="temperature-tab" class="rounded-lg bg-slate-100 px-5 py-3 font-medium text-slate-700">
                        Temperature 
                    </button>
                </nav>

                 <div id="converter-content">
                    <h2 id="converter-title" class="text-xl font-semibold text-slate-800">
                        Weight Converter 
                    </h2>
                    <p id="converter-description" class="mt-2 text-slate-500">
                        Convert between kilograms and pounds
                    </p>
                    <form id="conversion-form" class="mt-8 space-y-5">
                        <!-- Value input -->
                         <div>
                            <label for="conversion-input" class="mb-2 block font-medium text-slate-700">
                                Value(s) to convert 
                            </label>

                            <input 
                                type="text"
                                id="conversion-input"
                                class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                                required
                            >
                            <p class="mt-2 text-sm text-slate-500">
                                Enter one number or separate multiple numbers with commas.
                            </p>
                         </div>

                         <!-- Unit selection -->
                          <div class="grid gap-4 sm:grid-cols-2">
                            <div>
                                <label for="from-unit" class="mb-2 block font-medium text-slate-300">
                                    From 
                                </label>

                                <select id="from-unit" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3"></select>
                            </div>

                            <div>
                                <label for="to-unit" class="mb-2 block font-medium text-slate-700">
                                    To 
                                </label>

                                <select id="to-unit" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3"></select>
                            </div>
                          </div>

                          <!-- Submit Button -->
                           <button type="submit" class="w-full rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700">
                                Convert 
                           </button>
                    </form>

                    <!-- Conversion results -->
                     <div 
                        id="conversion-result"
                        role="status"
                        aria-live="polite"
                        class="mt-6 hidden rounded-lg bg-indigo-50 p-5 text-indigo-900"></div>
                 </div>
             </section>
        </main>
    </body>
</html>
